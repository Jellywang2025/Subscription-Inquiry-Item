name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查协作文档和提交差异
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -w -t tree --stdin </dev/null)
          fi
          bash scripts/check-governance.sh "$BASE_SHA" "$GITHUB_SHA"

  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QUOTA_CODEX_BASE_URL: http://127.0.0.1:1
      QUOTA_DEEPSEEK_BASE_URL: http://127.0.0.1:1
      QUOTA_MIMO_BASE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          python-version: '3.12'
      - name: 安装锁定的开发依赖
        run: uv sync --locked --python 3.12
      - name: 静态检查
        run: |
          uv run --locked pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check quota_dashboard/static/app.js
      - name: 运行 Windows 全量测试
        run: |
          $env:QUOTA_STATE_FILE = Join-Path $env:RUNNER_TEMP 'quota-ci-state.json'
          uv run --locked pytest --basetemp=.tmp-ci-tests -p no:cacheprovider
